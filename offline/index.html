<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MU H5 2.8 • Chơi đơn</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07131b;color:#e9e3d5;font:14px system-ui,Arial;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none}button,input,select{font:inherit}
button{cursor:pointer;background:linear-gradient(#484153,#1f2a36);color:#f8ddb0;border:1px solid #8b734c;border-radius:9px;padding:10px}
button:active{transform:translateY(1px)}.hud{position:fixed;left:10px;top:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.panel{background:#101c2ce8;border:1px solid #80633e;border-radius:12px;padding:10px;box-shadow:0 9px 24px #0008;pointer-events:auto}
#stats{width:min(330px,58vw)}#name{color:#f3d088;font-size:16px;font-weight:bold}small{color:#b5bfcc}
.bar{height:15px;border-radius:8px;overflow:hidden;background:#101015;position:relative;margin:4px 0;border:1px solid #526274}
.bar i{display:block;height:100%;transition:width .2s}.bar span{position:absolute;inset:0;text-align:center;font-size:10px;color:white}
#hp i{background:linear-gradient(90deg,#8e2929,#f25c54)}#mp i{background:linear-gradient(90deg,#234e94,#64aaf5)}#xp i{background:linear-gradient(90deg,#7d6127,#e6c560)}
.right{text-align:right;display:grid;justify-items:end;gap:6px}.tag{background:#174a3f;border:1px solid #47a18b;padding:6px 10px;border-radius:25px;color:#baf1d9;font-size:11px}
select{padding:7px;background:#182b37;color:#f4dfac;border:1px solid #80633e;border-radius:7px;max-width:140px}
#controls{position:fixed;bottom:13px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:7px;width:98vw}
#controls button{min-width:69px}#controls #atk{background:linear-gradient(#964437,#47232b)}#controls #skill{background:linear-gradient(#4d60aa,#303566)}#controls #heal{background:linear-gradient(#347d4d,#17482c)}
#quest{position:fixed;top:145px;left:10px;max-width:280px;font-size:12px}
#shade{position:fixed;inset:0;background:#060a10db;z-index:9;display:flex;align-items:center;justify-content:center;padding:15px}
#modal{background:linear-gradient(145deg,#1d2b3c,#101924);border:1px solid #b28d49;border-radius:18px;padding:22px;max-width:590px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 25px 65px #000c}
h1{font:800 34px Georgia;color:#f0ca81;margin:0 0 4px}h2{color:#f0ca81}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.grid button{padding:10px 3px;min-height:75px}.grid button b{display:block;font-size:24px}
.selected{background:linear-gradient(#8a703e,#5a462a);border-color:#ffd18a}input{width:100%;padding:10px;background:#142332;border:1px solid #886e4c;color:white;border-radius:7px;margin:9px 0}
.gold{background:linear-gradient(#ffdf95,#bb9050);color:#2a190a;font-weight:bold;padding:11px 17px}
.note{background:#243240;border-left:3px solid #c9a967;color:#c7d3de;padding:10px;font-size:12px;margin-top:16px}
#toast{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);color:#ffdb7d;font-size:19px;font-weight:800;text-shadow:0 2px 5px #000;pointer-events:none}
@media(max-width:650px){#name{font-size:13px}#stats{width:53vw}.right{max-width:45vw}.right .panel{padding:5px}select{max-width:95px;font-size:11px}#controls{bottom:6px;gap:4px}#controls button{padding:8px 6px;min-width:52px;font-size:12px}#quest{top:128px;max-width:210px}.grid{grid-template-columns:repeat(2,1fr)}#modal{padding:14px}}
</style></head><body>
<canvas id="canvas"></canvas>
<div class="hud"><div class="panel" id="stats"><div><strong id="name">MU H5 Offline</strong> <small id="level"></small></div><small id="class"></small><div class="bar" id="hp"><i></i><span></span></div><div class="bar" id="mp"><i></i><span></span></div><div class="bar" id="xp"><i></i><span></span></div></div><div class="right"><div class="tag">● OFFLINE · Chơi đơn</div><div class="panel"><div id="gold">◈ 0 Zen</div><select id="maps"><option>Lorencia</option><option>Noria</option><option>Devias</option><option>Dungeon</option><option>Lost Tower</option><option>Atlans</option><option>Tarkan</option></select></div></div></div>
<div class="panel" id="quest">⚔ Nhiệm vụ: <b id="progress">Hạ 10 quái</b><br><small>Chạm mặt đất để đi · WASD di chuyển</small></div>
<div id="controls"><button id="atk">⚔ Đánh</button><button id="skill">✦ Kỹ năng</button><button id="heal">✚ HP</button><button id="auto">⚙ Auto</button><button id="bag">🎒 Túi đồ</button><button id="shop">🏪 NPC</button><button id="menu">☰ Menu</button></div>
<div id="toast"></div><div id="shade"><div id="modal"></div></div>
<script>
(()=>{
'use strict';
const el=id=>document.getElementById(id),canvas=el('canvas'),ctx=canvas.getContext('2d'),store='mu_h5_28_offline_v1';
const classes=[['Dark Knight','⚔','#dcaa78',180,65],['Dark Wizard','✦','#a3acfa',110,180],['Fairy Elf','🏹','#86dca6',135,120],['Magic Gladiator','🗡','#d4d9e3',160,130],['Dark Lord','♛','#f4cc86',165,125],['Summoner','☯','#ce97c8',120,175],['Rage Fighter','✊','#e4807b',200,65]];
const maps=[['Lorencia','#315543','#152c2a'],['Noria','#326945','#163b30'],['Devias','#95aab7','#263f5f'],['Dungeon','#504950','#211a26'],['Lost Tower','#6e624c','#302726'],['Atlans','#397b86','#123d63'],['Tarkan','#aa8657','#44301d']];
const elements=[['Kim','#bcceda','⚙'],['Mộc','#65d78b','🌿'],['Thủy','#65c9ed','💧'],['Hỏa','#f29b64','🔥'],['Thổ','#d7bd82','◆']];
let hero=null,enemies=[],drops=[],target=null,keys={},auto=false,chosen=0,last=0,hit=0,time=0,w=0,h=0,dpr=1,toastEnd=0;
try{hero=JSON.parse(localStorage.getItem(store))}catch(e){}
function maxhp(){return classes[hero.c][3]+(hero.level-1)*13+hero.def*2}
function maxmp(){return classes[hero.c][4]+(hero.level-1)*6}
function need(){return hero.level*hero.level*45+100}
function save(){if(hero)localStorage.setItem(store,JSON.stringify(hero))}
function message(t){el('toast').textContent=t;toastEnd=performance.now()+1700}
function open(title,content){el('modal').innerHTML='<button id="close" style="float:right">✕</button><h2>'+title+'</h2>'+content;el('shade').style.display='flex';el('close').onclick=()=>el('shade').style.display='none'}
function start(){el('shade').style.display='flex';let buttons=classes.map((c,i)=>'<button data-c="'+i+'" class="'+(chosen===i?'selected':'')+'"><b>'+c[1]+'</b>'+c[0]+'</button>').join('');
el('modal').innerHTML='<h1>MU • BÌNH MINH</h1><p>H5 2.8 · Chế độ chơi đơn trên trình duyệt</p>'+(hero?'<button class="gold" id="continue">▶ Tiếp tục '+hero.name+' · Lv '+hero.level+'</button><hr>':'')+'<p>Chọn hệ nhân vật:</p><div class="grid">'+buttons+'</div><input id="newname" maxlength="20" value="MuHero" placeholder="Tên nhân vật"><button class="gold" id="create">Bắt đầu chơi</button><p class="note">Bản offline trình duyệt rút gọn: chiến đấu, bản đồ, quái Ngũ hành, NPC, vật phẩm, cấp độ và lưu trên máy. Không có tài khoản online, PvP, bang hội hoặc máy chủ game. Bản Full 2.8 nguyên gốc chạy offline trên PC bằng launcher riêng.</p>';
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{chosen=Number(b.dataset.c);start()});
if(hero)el('continue').onclick=()=>{resetMissing();go()};
el('create').onclick=()=>{let name=el('newname').value.trim();if(name.length<3){message('Tên ít nhất 3 ký tự');return}hero={name,c:chosen,level:1,xp:0,zen:1000,hp:classes[chosen][3],mp:classes[chosen][4],x:0,y:0,map:0,kills:0,potions:5,atk:0,def:0,items:[]};go()};
}
function resetMissing(){hero.x=hero.x||0;hero.y=hero.y||0;hero.items=hero.items||[];hero.atk=hero.atk||0;hero.def=hero.def||0;hero.potions=hero.potions||0}
function go(){resetMissing();el('shade').style.display='none';spawn();updateHud();save();message('Chào mừng đến '+maps[hero.map][0])}
function spawn(){enemies=[];drops=[];target=null;for(let i=0;i<24;i++){let a=i*2.399,r=5+(i*7%12),x=Math.cos(a)*r,y=Math.sin(a)*r;let hp=42+hero.map*25+hero.level*6;enemies.push({x,y,hp,max:hp,element:i%5,dead:0,id:i})}}
function updateHud(){if(!hero)return;el('name').textContent=hero.name;el('level').textContent='Lv '+hero.level;el('class').textContent=classes[hero.c][0]+' · '+maps[hero.map][0];for(let [id,val,max] of [['hp',hero.hp,maxhp()],['mp',hero.mp,maxmp()],['xp',hero.xp,need()]]){el(id).querySelector('i').style.width=Math.min(100,100*val/max)+'%';el(id).querySelector('span').textContent=id.toUpperCase()+' '+Math.round(val)+' / '+max}el('gold').textContent='◈ '+hero.zen.toLocaleString('vi-VN')+' Zen';el('maps').selectedIndex=hero.map;el('progress').textContent='Hạ quái '+hero.kills%10+'/10';el('auto').textContent=auto?'⚙ Auto ON':'⚙ Auto'}
function nearest(range){if(!hero)return null;let best=null;for(let m of enemies){let d=Math.hypot(m.x-hero.x,m.y-hero.y);if(!m.dead&&d<range){range=d;best=m}}return best}
function attack(magic=false){if(!hero||el('shade').style.display!=='none'||time-hit<(magic?850:330))return;let m=nearest(magic?4.5:3);if(!m){message('Hãy lại gần quái');return}if(magic&&hero.mp<15){message('Không đủ mana');return}hit=time;if(magic)hero.mp-=15;let targets=magic?enemies.filter(q=>!q.dead&&Math.hypot(q.x-hero.x,q.y-hero.y)<4.5):[m];for(let q of targets){let damage=10+hero.level*3+hero.atk+Math.round(Math.random()*9)+(magic?22:0);q.hp-=damage;if(q.hp<=0){q.dead=time+4800;hero.zen+=30+hero.map*15;hero.xp+=25+hero.map*12;hero.kills++;if(Math.random()<.3)drops.push({x:q.x,y:q.y,g:50+Math.round(Math.random()*60)});if(hero.kills%10===0){hero.zen+=500;hero.potions+=2;message('✓ Hoàn thành nhiệm vụ săn quái!')}}}while(hero.xp>=need()){hero.xp-=need();hero.level++;hero.hp=maxhp();hero.mp=maxmp();message('✨ LÊN CẤP '+hero.level+' ✨')}updateHud();save()}
function potion(){if(!hero.potions){message('Hết bình HP, ghé NPC');return}hero.potions--;hero.hp=Math.min(maxhp(),hero.hp+Math.round(maxhp()*.6));updateHud();save()}
function shops(){open('🏪 Thương nhân Lorencia','<p>Bạn có '+hero.zen+' Zen</p>'+[['Kiếm +12 ATK',850,12,0],['Giáp +8 DEF',650,0,8],['3 bình HP',120,0,0]].map((v,i)=>'<p><button data-buy="'+i+'">Mua '+v[0]+' — '+v[1]+' Zen</button></p>').join(''));document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let v=[[850,12,0],[650,0,8],[120,0,0]][Number(b.dataset.buy)];if(hero.zen<v[0]){message('Thiếu Zen');return}hero.zen-=v[0];hero.atk+=v[1];hero.def+=v[2];if(Number(b.dataset.buy)===2)hero.potions+=3;else hero.items.push(['Kiếm','Giáp'][Number(b.dataset.buy)]);save();updateHud();shops()})}
function bag(){open('🎒 Hành trang','<p>Zen: '+hero.zen+' · HP: '+hero.potions+' bình</p><p>ATK cộng thêm: '+hero.atk+' · DEF cộng thêm: '+hero.def+'</p><p>Trang bị: '+(hero.items.join(', ')||'Chưa có')+'</p><p>Dữ liệu được lưu tự động ngay trên trình duyệt.</p>')}
function menu(){open('☰ MU H5 2.8 Offline','<p>Đi lại: WASD hoặc phím mũi tên, chạm vào bản đồ. Đánh: Space; Kỹ năng: E; Bình HP: Q; Auto: T.</p><p>✓ 7 lớp nhân vật · 7 bản đồ · 5 hệ quái · NPC · Zen · tăng cấp · lưu ngoại tuyến.</p><p>✕ Không đăng nhập, multiplayer, PvP hoặc đồng bộ máy chủ.</p><p class="note">Đây là bản rút gọn chạy bằng JavaScript tại trình duyệt, không phải toàn bộ engine và tài nguyên game Full 2.8.</p><button id="restart">Tạo nhân vật mới</button>');el('restart').onclick=()=>{if(confirm('Tạo nhân vật mới sẽ xoá tiến trình hiện tại?')){localStorage.removeItem(store);hero=null;start()}}}
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}
function project(x,y){return{x:w/2+(x-hero.x-y+hero.y)*34,y:h/2+(x-hero.x+y-hero.y)*17-18}}
function unproject(x,y){let a=(x-w/2)/34,b=(y-h/2+18)/17;return{x:hero.x+(a+b)/2,y:hero.y+(b-a)/2}}
function diamond(x,y,c){ctx.beginPath();ctx.moveTo(x,y-17);ctx.lineTo(x+34,y);ctx.lineTo(x,y+17);ctx.lineTo(x-34,y);ctx.closePath();ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='#0002';ctx.stroke()}
function label(txt,x,y,c){ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillStyle='#000';ctx.fillText(txt,x+1,y+1);ctx.fillStyle=c;ctx.fillText(txt,x,y)}
function draw(){let map=maps[hero.map],b=ctx.createLinearGradient(0,0,0,h);b.addColorStop(0,map[2]);b.addColorStop(1,map[1]);ctx.fillStyle=b;ctx.fillRect(0,0,w,h);
for(let x=Math.round(hero.x)-19;x<=Math.round(hero.x)+19;x++)for(let y=Math.round(hero.y)-19;y<=Math.round(hero.y)+19;y++){let p=project(x,y);if(p.x<-40||p.x>w+40||p.y<-40||p.y>h+40)continue;let n=Math.abs((x*17+y*31+x*y*7)%13);diamond(p.x,p.y,n%6===0?map[2]:map[1]);if(n===0&&Math.hypot(x,y)>4){ctx.fillStyle=hero.map===2?'#dce9f1':hero.map===6?'#b69d6c':'#29654a';ctx.beginPath();ctx.moveTo(p.x,p.y-48);ctx.lineTo(p.x-15,p.y-9);ctx.lineTo(p.x+16,p.y-9);ctx.fill();ctx.fillStyle='#4f4032';ctx.fillRect(p.x-2,p.y-12,4,12)}}
let actors=enemies.filter(m=>!m.dead).map(m=>({order:m.x+m.y,mob:m}));actors.push({order:hero.x+hero.y,player:true});actors.sort((a,b)=>a.order-b.order);
for(let a of actors){if(a.player){let p=project(hero.x,hero.y);ctx.fillStyle='#08090b9a';ctx.beginPath();ctx.ellipse(p.x,p.y,18,7,0,0,7);ctx.fill();ctx.fillStyle=classes[hero.c][2];ctx.beginPath();ctx.moveTo(p.x,p.y-48);ctx.lineTo(p.x-14,p.y-9);ctx.lineTo(p.x+14,p.y-9);ctx.fill();ctx.fillStyle='#e3ae86';ctx.beginPath();ctx.arc(p.x,p.y-47,9,0,7);ctx.fill();ctx.strokeStyle='#e3e6d9';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x+12,p.y-34);ctx.lineTo(p.x+23,p.y-58);ctx.stroke();label(hero.name,p.x,p.y-70,'#ffdfa2')}
else{let m=a.mob,p=project(m.x,m.y);if(p.x<-50||p.x>w+50||p.y<-80||p.y>h+30)continue;ctx.fillStyle=elements[m.element][1];ctx.beginPath();ctx.ellipse(p.x,p.y-15,13,19,0,0,7);ctx.fill();ctx.fillStyle='#172634';ctx.fillRect(p.x-6,p.y-20,4,3);ctx.fillRect(p.x+4,p.y-20,4,3);ctx.fillStyle='#2d191d';ctx.fillRect(p.x-15,p.y-43,30,4);ctx.fillStyle='#ec5558';ctx.fillRect(p.x-15,p.y-43,30*Math.max(0,m.hp)/m.max,4);label(elements[m.element][2],p.x+16,p.y-29,elements[m.element][1])}}
for(let d of drops){let p=project(d.x,d.y);label('◈ '+d.g,p.x,p.y-16,'#f5d27b')}}
function loop(t){if(!last)last=t;let dt=Math.min((t-last)/1000,.05);last=t;time=t;ctx.setTransform(dpr,0,0,dpr,0,0);if(hero){if(el('shade').style.display==='none'){let vx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),vy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);if(vx||vy){target=null;let n=Math.hypot(vx,vy);hero.x+=vx/n*4*dt;hero.y+=vy/n*4*dt}else if(target){let dist=Math.hypot(target.x-hero.x,target.y-hero.y);if(dist<.15)target=null;else{hero.x+=(target.x-hero.x)/dist*4*dt;hero.y+=(target.y-hero.y)/dist*4*dt}}if(auto&&time-hit>500){if(nearest(3.2))attack();else if(!target){let m=nearest(50);if(m)target={x:m.x,y:m.y}}}}draw();if(Math.floor(t/750)!==Math.floor((t-dt*1000)/750)){for(let m of enemies){if(m.dead&&m.dead<t){m.dead=0;m.hp=m.max;m.x=(Math.random()-.5)*28;m.y=(Math.random()-.5)*28}else if(!m.dead&&Math.hypot(m.x-hero.x,m.y-hero.y)<2){hero.hp=Math.max(1,hero.hp-(3+hero.map));if(hero.hp<=1){hero.hp=maxhp();hero.x=0;hero.y=0;message('Hồi sinh tại thành')}}}for(let i=drops.length-1;i>=0;i--)if(Math.hypot(hero.x-drops[i].x,hero.y-drops[i].y)<1.6){hero.zen+=drops[i].g;drops.splice(i,1)}hero.mp=Math.min(maxmp(),hero.mp+1);updateHud();save()}}
if(t>toastEnd)el('toast').textContent='';requestAnimationFrame(loop)}
canvas.addEventListener('pointerdown',e=>{if(!hero||el('shade').style.display!=='none')return;let p=unproject(e.clientX,e.clientY);let m=enemies.find(q=>!q.dead&&Math.hypot(p.x-q.x,p.y-q.y)<1.3);if(m){if(Math.hypot(hero.x-m.x,hero.y-m.y)<3)attack();else target={x:m.x,y:m.y}}else target={x:p.x,y:p.y}});
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(!hero||e.repeat)return;let k=e.key.toLowerCase();if(e.key===' ')attack();if(k==='e')attack(true);if(k==='q')potion();if(k==='t')el('auto').click()});document.addEventListener('keyup',e=>keys[e.key]=false);window.addEventListener('blur',()=>{keys={};save()});window.addEventListener('resize',resize);
el('atk').onclick=()=>attack();el('skill').onclick=()=>attack(true);el('heal').onclick=()=>{if(hero)potion()};el('auto').onclick=()=>{auto=!auto;target=null;updateHud()};el('bag').onclick=()=>{if(hero)bag()};el('shop').onclick=()=>{if(hero)shops()};el('menu').onclick=()=>{if(hero)menu()};el('maps').onchange=()=>{if(hero){hero.map=el('maps').selectedIndex;hero.x=0;hero.y=0;hero.hp=maxhp();spawn();updateHud();save();message('Đến '+maps[hero.map][0])}};resize();start();requestAnimationFrame(loop);
})();
</script></body></html>
